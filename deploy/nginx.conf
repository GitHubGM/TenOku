# Example location to place inside your existing HTTPS server block.
# Configure your domain and TLS certificate in that server block.
# Nginx must run on the same host as the Compose-published port.
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replace any client-supplied forwarding chain with the real peer address.
    proxy_set_header X-Forwarded-For $remote_addr;
    # Tutor input moderation + generation + output moderation can take 90s.
    proxy_read_timeout 110s;
    client_max_body_size 64k;
}
